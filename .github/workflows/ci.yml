name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: Compose config is valid (prod and local)
        run: |
          mkdir -p secrets && touch secrets/htpasswd && cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.local.yml config -q
      - name: nginx config is valid
        run: |
          docker run --rm -v "$PWD/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/secrets/htpasswd:/etc/nginx/htpasswd:ro" --add-host backend:127.0.0.1 \
            nginx:1.29-alpine nginx -t
