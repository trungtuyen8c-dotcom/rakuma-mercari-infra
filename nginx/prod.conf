# Production web config (mounted over the image's default.conf by docker-compose.prod.yml).
# Until a domain + Google OAuth exist, the whole site sits behind HTTP basic auth.
# API-key requests (Authorization: Bearer ...) skip basic auth; the backend checks the key itself.
map $http_authorization $rakuma_auth {
    ~^Bearer\s  off;
    default     "Rakuma";
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    auth_basic $rakuma_auth;
    auth_basic_user_file /etc/nginx/htpasswd;

    location = /healthz {
        auth_basic off;
        proxy_pass http://backend:8080/healthz;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
