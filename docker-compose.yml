# Full stack: Postgres + Go API + web (nginx serving the SPA and proxying /api).
# Images come from GHCR, pinned by BACKEND_TAG / WEB_TAG in .env (set by scripts/release.sh on deploy).
# Local builds from the sibling repos: add -f docker-compose.local.yml (see Makefile `up`).
name: rakuma

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-rakuma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rakuma}
      POSTGRES_DB: ${DB_NAME:-rakuma}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"

  backend:
    image: ghcr.io/trungtuyen8c-dotcom/rakuma-mercari-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:8088}
      DATABASE_URL: postgres://${DB_USER:-rakuma}:${DB_PASSWORD:-rakuma}@db:5432/${DB_NAME:-rakuma}?sslmode=disable
      RAKUMA_OWNER_EMAIL: ${RAKUMA_OWNER_EMAIL:-chushop.rakuma@gmail.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./data:/data:ro # put rakuma_t7.xlsx here for the import
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: ghcr.io/trungtuyen8c-dotcom/rakuma-mercari-frontend:${WEB_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8088}:80"

volumes:
  db_data:
