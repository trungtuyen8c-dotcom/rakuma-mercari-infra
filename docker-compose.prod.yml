# VPS overrides: web on port 80 behind basic auth, Postgres not published at all.
# Use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  db:
    ports: !reset []
  web:
    ports: !override
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/htpasswd:/etc/nginx/htpasswd:ro
